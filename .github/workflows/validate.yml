name: Validate repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_repo.py --base "$RELEASE_BASE"
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python3 -m unittest discover -s tests -v
