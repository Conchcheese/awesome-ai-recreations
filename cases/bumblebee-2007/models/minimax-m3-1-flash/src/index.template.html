<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大黄蜂 · 2007 真人电影版 · 复刻研究台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07090d; color: #d7dce3;
    font: 13px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid #1b2028; background: #0a0d12;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  header .tag { color: #7c8794; font-size: 12px; }
  header .model { color: #e0a33a; font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 52px); }
  #view { position: relative; background: #05070b; }
  #view canvas { display: block; width: 100%; height: 100%; }
  aside { border-left: 1px solid #1b2028; background: #0a0d12; overflow: auto; padding: 12px 14px; }
  .row { cursor: pointer; padding: 2px 4px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .row:hover { background: #161c25; }
  .row.sel { background: #1d2836; color: #f0c060; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  section { margin-bottom: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #7c8794; margin: 0 0 8px; font-weight: 600; }
  .ctl { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .ctl label { white-space: nowrap; color: #9aa5b1; min-width: 62px; }
  input[type=range] { flex: 1; accent-color: #e0a33a; }
  button {
    background: #1a212b; color: #d7dce3; border: 1px solid #29323d;
    border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: #e0a33a; color: #f0c060; }
  #info { background: #10151c; border: 1px solid #1b2028; border-radius: 5px; padding: 9px 11px; font-size: 12px; }
  #counts { color: #6f7a87; font-size: 11.5px; margin-top: 8px; }
  #tree { max-height: 44vh; overflow: auto; }
  .note { color: #6f7a87; font-size: 11.5px; margin-top: 8px; }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; height: auto; }
    #view { height: 62vh; }
    aside { border-left: none; border-top: 1px solid #1b2028; }
    #tree { max-height: 30vh; }
  }
</style>
</head>
<body>
<header>
  <h1>大黄蜂 · 2007 真人电影版</h1>
  <span class="tag">独立程序化复刻 · fidelity</span>
  <span class="model">模型：Minimax-M3.1-Flash</span>
  <span class="tag" id="time">0.00 s</span>
</header>
<main>
  <div id="view"></div>
  <aside>
    <section>
      <h2>时间线</h2>
      <div class="ctl"><input type="range" id="timeline" value="0"></div>
      <div class="ctl">
        <button id="play">播放</button>
        <label style="min-width:auto"><input type="checkbox" id="film"> 影片机位</label>
      </div>
    </section>
    <section>
      <h2>显示</h2>
      <div class="ctl"><label for="gray">灰模</label><input type="checkbox" id="gray"></div>
      <div class="ctl"><label for="system">系统分色</label><input type="checkbox" id="system"></div>
      <div class="ctl"><label for="explode">拆解</label><input type="range" id="explode" min="0" max="2.4" step="0.01" value="0"><span id="explodeVal" style="width:30px;text-align:right">0.00</span></div>
    </section>
    <section>
      <h2>装配</h2>
      <div id="info"></div>
      <div id="counts"></div>
    </section>
    <section>
      <h2>装配树</h2>
      <div id="tree"></div>
      <p class="note">灰模与系统分色仅用于结构检查；变形中段为机构推演，非电影原帧机构证据。</p>
    </section>
  </aside>
</main>
<script>/*__BUNDLE__*/</script>
</body>
</html>
