<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大黄蜂 · 2007 真人电影版 · 短片巡览</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #05070b; color: #d7dce3;
    font: 13px/1.6 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .hud {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 12px;
    background: linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,0));
    display: flex; align-items: center; gap: 14px;
  }
  .hud input[type=range] { flex: 1; accent-color: #e0a33a; }
  button { background: #1a212b; color: #d7dce3; border: 1px solid #29323d; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  #label { color: #f0c060; }
  #clock { color: #7c8794; font-family: ui-monospace, Menlo, monospace; }
  .credit { position: fixed; top: 12px; left: 16px; font-size: 12px; color: #8b96a3; }
</style>
</head>
<body>
<div id="view"></div>
<div class="credit">大黄蜂 · 2007 真人电影版 · Minimax-M3.1-Flash 独立复刻 · 同源模型实时渲染</div>
<div class="hud">
  <button id="play">暂停</button>
  <input type="range" id="scrub" min="0" max="20" step="0.041666" value="0">
  <span id="label"></span>
  <span id="clock"></span>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
